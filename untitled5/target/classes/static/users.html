<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 校园活动管理系统</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
  <nav class="navbar">
    <div class="nav-brand">
      <i class="fas fa-school"></i>
      <span>校园活动管理系统</span>
    </div>
    <div class="nav-links">
      <a href="/"><i class="fas fa-home"></i> 首页</a>
      <a href="/activities.html"><i class="fas fa-calendar-alt"></i> 活动管理</a>
      <a href="/users.html" class="active"><i class="fas fa-users"></i> 用户管理</a>
      <a href="/registrations.html"><i class="fas fa-clipboard-list"></i> 报名管理</a>
    </div>
  </nav>

  <div class="content-section">
    <h1><i class="fas fa-users"></i> 用户管理</h1>
    <div id="users-list">
      加载中...
    </div>
  </div>
</div>

<script>
  async function loadUsers() {
      try {
          const response = await fetch('/api/users');
          const data = await response.json();

          const container = document.getElementById('users-list');
          if (data.data && data.data.length > 0) {
              container.innerHTML = `
                  <table class="data-table">
                      <thead>
                          <tr>
                              <th>ID</th>
                              <th>用户名</th>
                              <th>手机号</th>
                              <th>邮箱</th>
                              <th>角色</th>
                              <th>创建时间</th>
                          </tr>
                      </thead>
                      <tbody>
                          ${data.data.map(user => `
                              <tr>
                                  <td>${user.id}</td>
                                  <td>${user.username}</td>
                                  <td>${user.phone || '未设置'}</td>
                                  <td>${user.email || '未设置'}</td>
                                  <td><span class="badge">${user.role || 'USER'}</span></td>
                                  <td>${new Date(user.createdAt).toLocaleDateString()}</td>
                              </tr>
                          `).join('')}
                      </tbody>
                  </table>
              `;
          } else {
              container.innerHTML = '<p>暂无用户数据</p>';
          }
      } catch (error) {
          document.getElementById('users-list').innerHTML =
              `<p class="error">加载失败: ${error.message}</p>`;
      }
  }

  document.addEventListener('DOMContentLoaded', loadUsers);
</script>

<style>
  .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
  }

  .data-table th, .data-table td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
  }

  .data-table th {
      background-color: #f2f2f2;
      font-weight: bold;
  }

  .data-table tr:nth-child(even) {
      background-color: #f9f9f9;
  }

  .data-table tr:hover {
      background-color: #f5f5f5;
  }

  .badge {
      background-color: #3498db;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
  }
</style>
</body>
</html>
