<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园活动报名系统</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #3498db;
      --secondary-color: #2c3e50;
      --success-color: #27ae60;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      padding-top: 20px;
      padding-bottom: 50px;
    }

    .header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 30px 0;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .header h1 {
      font-weight: 600;
      margin: 0;
    }

    .header .lead {
      opacity: 0.9;
      margin-top: 10px;
    }

    .card-container {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card-container h3 {
      color: var(--secondary-color);
      border-bottom: 3px solid var(--primary-color);
      padding-bottom: 10px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .user-select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
      background-color: white;
    }

    .user-select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
      outline: none;
    }

    .activity-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border-left: 5px solid var(--primary-color);
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
    }

    .activity-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
    }

    .activity-card h4 {
      color: var(--secondary-color);
      margin-bottom: 15px;
      font-weight: 600;
    }

    .activity-card p {
      color: #555;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .activity-card strong {
      color: var(--secondary-color);
      min-width: 70px;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color), #2980b9);
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 16px;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #2980b9, var(--primary-color));
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success-color), #229954);
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 16px;
      transition: all 0.3s;
      margin-top: 10px;
      width: 100%;
    }

    .btn-success:hover {
      background: linear-gradient(135deg, #229954, var(--success-color));
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
    }

    .activity-meta {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      color: #666;
    }

    .activity-meta i {
      width: 20px;
      margin-right: 10px;
      color: var(--primary-color);
    }

    .participants-info {
      background: rgba(52, 152, 219, 0.1);
      padding: 10px 15px;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: 500;
    }

    .alert-message {
      display: none;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: 500;
    }

    .alert-success {
      background-color: rgba(46, 204, 113, 0.1);
      border-left: 4px solid var(--success-color);
      color: #27ae60;
    }

    .alert-error {
      background-color: rgba(231, 76, 60, 0.1);
      border-left: 4px solid #e74c3c;
      color: #c0392b;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .loading i {
      font-size: 24px;
      margin-bottom: 10px;
      color: var(--primary-color);
    }

    .no-data {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }

    .no-data i {
      font-size: 48px;
      margin-bottom: 15px;
      color: #ddd;
    }

    @media (max-width: 768px) {
      .header {
        padding: 20px 0;
        margin-bottom: 20px;
      }

      .card-container {
        padding: 20px;
      }

      .activity-card {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- 页面头部 -->
  <div class="header text-center">
    <div class="container">
      <h1><i class="fas fa-calendar-check me-2"></i>校园活动报名系统</h1>
      <p class="lead">选择活动，立即报名参与丰富多彩的校园生活！</p>
    </div>
  </div>

  <!-- 用户选择区域 -->
  <div class="card-container">
    <h3><i class="fas fa-user-friends me-2"></i>选择报名用户</h3>
    <select id="userSelect" class="user-select">
      <option value="">请选择用户</option>
    </select>
    <div id="selectedUserInfo" class="alert alert-info mt-3" style="display: none;">
      <i class="fas fa-user-check me-2"></i>
      <span id="selectedUserName"></span>
    </div>
  </div>

  <!-- 活动列表区域 -->
  <div class="card-container">
    <h3><i class="fas fa-list-alt me-2"></i>可选活动</h3>
    <div id="loading" class="loading">
      <i class="fas fa-spinner fa-spin"></i>
      <p>正在加载活动列表...</p>
    </div>
    <div id="no-activities" class="no-data" style="display: none;">
      <i class="fas fa-calendar-times"></i>
      <h4>暂无可用活动</h4>
      <p>当前没有可报名的活动，请稍后再试。</p>
    </div>
    <div id="activities-container">
      <!-- 活动卡片将在这里显示 -->
    </div>
  </div>
</div>

<!-- 消息提示 -->
<div id="message" class="alert-message" style="display: none;"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // 全局变量
  let selectedUserId = null;

  // 页面加载时初始化
  document.addEventListener('DOMContentLoaded', function() {
    loadUsers();
    loadActivities();
  });

  // 加载用户列表
  async function loadUsers() {
    try {
      const response = await fetch('/api/users');
      const result = await response.json();

      const select = document.getElementById('userSelect');

      if (result.data && result.data.length > 0) {
        result.data.forEach(user => {
          const option = document.createElement('option');
          option.value = user.id;
          option.textContent = `${user.username || user.name} (${user.phone || '无联系方式'})`;
          select.appendChild(option);
        });

        // 如果有用户，默认选择第一个
        select.selectedIndex = 1;
        updateSelectedUser();
      } else {
        const option = document.createElement('option');
        option.textContent = '暂无用户数据';
        option.disabled = true;
        select.appendChild(option);
      }

    } catch (error) {
      console.error('加载用户失败:', error);
      showMessage('加载用户列表失败，请刷新页面重试', 'error');
    }
  }

  // 更新选中的用户信息
  function updateSelectedUser() {
    const select = document.getElementById('userSelect');
    const selectedOption = select.options[select.selectedIndex];

    if (selectedOption.value) {
      selectedUserId = selectedOption.value;
      const userInfo = document.getElementById('selectedUserInfo');
      const userNameSpan = document.getElementById('selectedUserName');

      userNameSpan.textContent = selectedOption.textContent;
      userInfo.style.display = 'block';
    } else {
      selectedUserId = null;
      document.getElementById('selectedUserInfo').style.display = 'none';
    }
  }

  // 加载活动列表
  async function loadActivities() {
    const loadingDiv = document.getElementById('loading');
    const noActivitiesDiv = document.getElementById('no-activities');
    const container = document.getElementById('activities-container');

    loadingDiv.style.display = 'block';
    container.innerHTML = '';

    try {
      const response = await fetch('/activities');
      const result = await response.json();

      loadingDiv.style.display = 'none';

      if (result.data && result.data.length > 0) {
        result.data.forEach(activity => {
          createActivityCard(activity);
        });
        noActivitiesDiv.style.display = 'none';
      } else {
        noActivitiesDiv.style.display = 'block';
      }

    } catch (error) {
      console.error('加载活动失败:', error);
      loadingDiv.style.display = 'none';
      noActivitiesDiv.style.display = 'block';
      showMessage('加载活动列表失败', 'error');
    }
  }

  // 创建活动卡片
  function createActivityCard(activity) {
    const container = document.getElementById('activities-container');

    // 计算报名百分比
    const percentage = activity.maxParticipants ?
      Math.round((activity.currentParticipants || 0) / activity.maxParticipants * 100) : 0;

    // 判断按钮状态
    const isFull = percentage >= 100;

    const card = document.createElement('div');
    card.className = 'activity-card';
    card.innerHTML = `
      <div class="row">
        <div class="col-md-8">
          <h4>${activity.title || '未命名活动'}</h4>
          <p>${activity.description || '暂无描述'}</p>

          <div class="activity-meta">
            <i class="fas fa-calendar-alt"></i>
            <span>时间：${new Date(activity.startTime).toLocaleString('zh-CN')} - ${new Date(activity.endTime).toLocaleString('zh-CN')}</span>
          </div>

          <div class="activity-meta">
            <i class="fas fa-map-marker-alt"></i>
            <span>地点：${activity.location || '未设置地点'}</span>
          </div>

          <div class="activity-meta">
            <i class="fas fa-university"></i>
            <span>学院：${activity.college || '未设置学院'}</span>
          </div>
        </div>

        <div class="col-md-4">
          <div class="participants-info">
            <div class="d-flex justify-content-between mb-2">
              <span>报名进度</span>
              <span>${activity.currentParticipants || 0}/${activity.maxParticipants || 0}</span>
            </div>
            <div class="progress" style="height: 8px;">
              <div class="progress-bar ${isFull ? 'bg-danger' : 'bg-success'}"
                   role="progressbar"
                   style="width: ${percentage}%">
              </div>
            </div>
          </div>

          <button class="btn ${isFull ? 'btn-secondary' : 'btn-success'}"
                  onclick="signUp(${activity.id})"
                  ${isFull ? 'disabled' : ''}>
            <i class="fas ${isFull ? 'fa-ban' : 'fa-user-plus'} me-2"></i>
            ${isFull ? '名额已满' : '立即报名'}
          </button>
        </div>
      </div>
    `;

    container.appendChild(card);
  }

  // 报名功能
  async function signUp(activityId) {
    if (!selectedUserId) {
      showMessage('请先选择用户！', 'error');
      return false;
    }

    try {
      showMessage('正在提交报名申请...', 'info');

      const response = await fetch('/api/registrations/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          userId: Number(selectedUserId),
          activityId: Number(activityId)
        })
      });

      const result = await response.json();

      if (result.code === 201) {
        showMessage('✅ ' + result.message, 'success');
        // 2秒后刷新页面
        setTimeout(() => location.reload(), 2000);
      } else {
        showMessage('❌ ' + result.message, 'error');
      }

    } catch (error) {
      console.error('报名失败:', error);
      showMessage('网络请求失败，请稍后重试', 'error');
    }

    return false;
  }

  // 显示消息
  function showMessage(message, type) {
    const messageDiv = document.getElementById('message');
    messageDiv.textContent = message;
    messageDiv.className = 'alert-message alert-' + (type === 'success' ? 'success' : 'error');
    messageDiv.style.display = 'block';

    // 自动隐藏
    if (type !== 'info') {
      setTimeout(() => {
        messageDiv.style.display = 'none';
      }, 5000);
    }
  }

  // 绑定用户选择事件
  document.getElementById('userSelect').addEventListener('change', updateSelectedUser);
</script>
</body>
</html>
